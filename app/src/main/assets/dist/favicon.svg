<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Botanical Nocturne Rounded Base -->
  <rect width="512" height="512" rx="128" fill="#0E1514"/>
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="#273B37" stroke-width="8"/>
  
  <!-- Subtle Emerald Ambient Glow -->
  <circle cx="256" cy="256" r="180" fill="#183B2E" opacity="0.45"/>
  
  <!-- LifeDeck Stack Layers -->
  <!-- Layer 1: Back Deck -->
  <rect x="136" y="120" width="240" height="170" rx="28" fill="#141D1B" stroke="#273B37" stroke-width="6"/>
  <!-- Layer 2: Mid Deck -->
  <rect x="120" y="170" width="272" height="190" rx="32" fill="#182E27" stroke="#4EDEA3" stroke-width="5" stroke-opacity="0.4"/>
  <!-- Layer 3: Front Focus Deck with Mint Accent -->
  <rect x="106" y="224" width="300" height="200" rx="36" fill="#10251F" stroke="#4EDEA3" stroke-width="8"/>
  
  <!-- Botanical Sprout / Leaf Motif Rising from Deck -->
  <path d="M256 120 C230 190 190 230 150 250 C180 270 230 260 256 220 C282 260 332 270 362 250 C322 230 282 190 256 120 Z" fill="#6FFBBE"/>
  <path d="M256 120 L256 270" stroke="#003824" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Glowing Milestone Star -->
  <circle cx="340" cy="180" r="16" fill="#F59E0B"/>
  <circle cx="340" cy="180" r="28" fill="#F59E0B" opacity="0.3"/>
</svg>
